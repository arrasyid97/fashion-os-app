name: Apply verified fabric stock deletion patch
on:
  push:
    branches: [codex/fabric-delete-publish-20261120]
    paths: [tools/fabric-delete-apply.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact verified source and remove temporary publisher
        run: python3 tools/fabric-delete-apply.py
      - name: Verify fabric deletion behavior
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/fabric-stock-delete.test.cjs
      - name: Commit verified source on preparation branch
        run: |
          git add src/App.vue tools/fabric-delete-apply.py .github/workflows/fabric-delete-apply.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Apply verified fabric group deletion interface"
          git push origin HEAD:codex/fabric-delete-publish-20261120
