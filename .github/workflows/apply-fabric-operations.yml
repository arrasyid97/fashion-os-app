name: Apply verified fabric shopping operations
on:
  push:
    branches: [codex/fabric-ops-publish-20261125]
    paths: [tools/apply-fabric-operations.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact tested source and remove temporary publisher
        run: python3 tools/apply-fabric-operations.py
      - name: Verify payment tracking and warehouse deletion
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/fabric-shopping-operations.test.cjs
          node tests/fabric-stock-delete.test.cjs
      - name: Commit verified source on preparation branch
        run: |
          git add src/App.vue tools/apply-fabric-operations.py .github/workflows/apply-fabric-operations.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Apply verified fabric shopping operations interface"
          git push origin HEAD:codex/fabric-ops-publish-20261125
